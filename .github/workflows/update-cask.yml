name: Update cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Veasel release tag (for example v0.64.4-next.0)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve latest Veasel release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh api 'repos/veasel-labs/veasel/releases?per_page=100' --jq '[.[] | select(.draft == false)][0].tag_name')"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$ ]] || {
            echo "::error::Unexpected Veasel release tag: $TAG"
            exit 1
          }
          VERSION="${TAG#v}"
          URL="https://github.com/veasel-labs/veasel/releases/download/${TAG}/veasel-macOS.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$URL" -o /tmp/veasel-macOS.tar.gz
          MANIFEST_URL="https://github.com/veasel-labs/veasel/releases/download/${TAG}/release.json"
          curl --fail --location --retry 5 --retry-all-errors "$MANIFEST_URL" -o /tmp/veasel-release.json
          SHA="$(shasum -a 256 /tmp/veasel-macOS.tar.gz | cut -d' ' -f1)"
          MANIFEST_TAG="$(jq -r '.tag' /tmp/veasel-release.json)"
          MANIFEST_VERSION="$(jq -r '.version' /tmp/veasel-release.json)"
          EXPECTED="$(jq -r '.assets[] | select(.name == "veasel-macOS.tar.gz") | .sha256' /tmp/veasel-release.json)"
          if [[ "$MANIFEST_TAG" != "$TAG" || "$MANIFEST_VERSION" != "$VERSION" || "$SHA" != "$EXPECTED" ]]; then
            echo "::error::Downloaded archive does not match the versioned Veasel release manifest."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "url=$URL"
            echo "branch=automation/cask-update"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare cask update branch
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch --create "$BRANCH" --track "origin/$BRANCH"
          else
            git switch --create "$BRANCH"
          fi
      - name: Update cask metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          ruby -e '
            path = "Casks/veasel-code.rb"
            body = File.read(path)
            { /^  url ".*"$/ => "  url \"#{ENV.fetch("URL")}\"",
              /^  version ".*"$/ => "  version \"#{ENV.fetch("VERSION")}\"",
              /^  sha256 ".*"$/ => "  sha256 \"#{ENV.fetch("SHA")}\"" }.each do |pattern, replacement|
              abort "cask field missing: #{pattern}" unless body.sub!(pattern, replacement)
            end
            File.write(path, body)
          '
          brew tap veasel-labs/tap "$GITHUB_WORKSPACE"
          cp Casks/veasel-code.rb "$(brew --repo veasel-labs/tap)/Casks/veasel-code.rb"
          brew style --cask veasel-labs/tap/veasel-code
      - name: Install and smoke-test the cask
        run: |
          set -euo pipefail
          brew install --cask veasel-labs/tap/veasel-code
          veasel --version
          veasel --help | grep -F "Commands:"
          executable="$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("veasel")))')"
          test -x "$(dirname "$executable")/veasel-tui"
          test -f "$(dirname "$executable")/build.json"
      - name: Commit release update
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          if git diff --quiet -- Casks/veasel-code.rb; then
            echo "Cask already reflects ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/veasel-code.rb
          git commit -m "chore: update Veasel Code to ${TAG}"
          git push --set-upstream origin "$BRANCH"
          cat > "$RUNNER_TEMP/cask-update-pr.md" <<EOF
          ## Summary

          Update the Homebrew cask to verified Veasel release ${TAG}.

          ## Validation

          The updater verifies the downloaded macOS archive against the release manifest and smoke-tests the installed backend and bundled TUI. Pull request CI repeats cask style, install, and command checks. A human reviews and merges this change.

          ## Scope

          Cask version, release URL, and SHA-256 only.
          EOF
          pull_request="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$GITHUB_REPOSITORY_OWNER:$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" --repo "$GITHUB_REPOSITORY" \
              --title "chore: update Veasel Code to ${TAG}" \
              --body-file "$RUNNER_TEMP/cask-update-pr.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --draft --title "chore: update Veasel Code to ${TAG}" \
              --body-file "$RUNNER_TEMP/cask-update-pr.md"
          fi
