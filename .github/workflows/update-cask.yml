name: Update cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Veasel release tag (for example v0.64.4-next.0)"
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve latest Veasel release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh api 'repos/veasel-labs/veasel/releases?per_page=100' --jq '[.[] | select(.draft == false)][0].tag_name // empty')"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$ ]] || {
            echo "::error::Unexpected Veasel release tag: $TAG"
            exit 1
          }
          URL="https://github.com/veasel-labs/veasel/releases/download/${TAG}/veasel-macOS.tar.gz"
          RELEASE_METADATA="$(curl --fail --location --retry 5 --retry-all-errors \
            "https://api.github.com/repos/veasel-labs/veasel/releases/tags/${TAG}")"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .immutable == true' \
            <<<"$RELEASE_METADATA" >/dev/null || {
              echo "::error::Veasel release $TAG is not an immutable published release."
              exit 1
            }
          VERSION="${TAG#v}"
          DESKTOP_URL="https://github.com/veasel-labs/veasel/releases/download/${TAG}/veasel-desktop-${VERSION}-mac-arm64.dmg"
          RELEASE_DIR="$RUNNER_TEMP/veasel-release"
          mkdir -p "$RELEASE_DIR"
          gh release download "$TAG" --repo veasel-labs/veasel --dir "$RELEASE_DIR" \
            --pattern 'veasel-macOS.tar.gz' \
            --pattern "veasel-desktop-${VERSION}-mac-arm64.dmg" \
            --pattern 'release.json'
          CLI_ARCHIVE="$RELEASE_DIR/veasel-macOS.tar.gz"
          DESKTOP_ASSET="$RELEASE_DIR/veasel-desktop-${VERSION}-mac-arm64.dmg"
          RELEASE_MANIFEST="$RELEASE_DIR/release.json"
          SHA="$(python3 scripts/verify_release.py "$TAG" "$RELEASE_MANIFEST" "$CLI_ARCHIVE")"
          DESKTOP_SHA="$(python3 scripts/verify_release.py --desktop "$TAG" "$RELEASE_MANIFEST" "$DESKTOP_ASSET")"
          DESKTOP_SIGNED="$(jq -r --arg asset_name "veasel-desktop-${VERSION}-mac-arm64.dmg" \
            '.assets[] | select(.name == $asset_name) | .signed' "$RELEASE_MANIFEST")"
          [[ "$DESKTOP_SIGNED" == true || "$DESKTOP_SIGNED" == false ]] || {
            echo "::error::Verified macOS Desktop asset has no boolean signature status."
            exit 1
          }
          CURRENT_VERSION="$(sed -nE 's/^  version "([^"]+)"$/\1/p' Casks/veasel-code.rb)"
          CURRENT_SHA="$(sed -nE 's/^  sha256 "([^"]+)"$/\1/p' Casks/veasel-code.rb)"
          CURRENT_DESKTOP_VERSION="$(sed -nE 's/^  version "([^"]+)"$/\1/p' Casks/veasel-desktop.rb)"
          CURRENT_DESKTOP_SHA="$(sed -nE 's/^  sha256 "([^"]+)"$/\1/p' Casks/veasel-desktop.rb)"
          TITLE="chore: update Veasel Code to ${TAG}"
          OPEN_PULL_REQUEST="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq -c \
            --arg title "$TITLE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch_prefix "automation/cask-update-${TAG}-" \
            '[.[] | select(
              .title == $title and
              .base.ref == "main" and
              .head.repo.full_name == $repository and
              .user.login == "github-actions[bot]" and
              (.head.ref | startswith($branch_prefix))
            )] | first // empty')"
          EXISTING_PR="$(jq -r '.number // empty' <<< "$OPEN_PULL_REQUEST")"
          EXISTING_BRANCH="$(jq -r '.head.ref // empty' <<< "$OPEN_PULL_REQUEST")"
          if [[ "$CURRENT_VERSION" == "$VERSION" && "$CURRENT_SHA" == "$SHA" && \
                "$CURRENT_DESKTOP_VERSION" == "$VERSION" && "$CURRENT_DESKTOP_SHA" == "$DESKTOP_SHA" ]]; then
            SKIP_UPDATE=true
            ALREADY_CURRENT=true
            echo "::notice::Cask already matches verified release ${TAG}; skipping branch and PR steps while retaining the install smoke test."
          elif [[ -n "$EXISTING_PR" ]]; then
            SKIP_UPDATE=true
            ALREADY_CURRENT=false
            echo "::notice::An update PR for ${TAG} is already open; waiting for its review instead of creating a duplicate."
            echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            SKIP_UPDATE=false
            ALREADY_CURRENT=false
            EXISTING_BRANCH="automation/cask-update-${TAG}-${GITHUB_RUN_ID}"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "url=$URL"
            echo "desktop_sha=$DESKTOP_SHA"
            echo "desktop_url=$DESKTOP_URL"
            echo "desktop_signed=$DESKTOP_SIGNED"
            echo "branch=$EXISTING_BRANCH"
            echo "skip_update=$SKIP_UPDATE"
            echo "already_current=$ALREADY_CURRENT"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare cask update branch
        if: steps.release.outputs.skip_update != 'true'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --create "$BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update cask metadata
        if: steps.release.outputs.skip_update != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
          SHA: ${{ steps.release.outputs.sha }}
          DESKTOP_URL: ${{ steps.release.outputs.desktop_url }}
          DESKTOP_SHA: ${{ steps.release.outputs.desktop_sha }}
          DESKTOP_SIGNED: ${{ steps.release.outputs.desktop_signed }}
        run: |
          ruby -e '
            { "Casks/veasel-code.rb" => { "URL" => "url", "SHA" => "sha256" },
              "Casks/veasel-desktop.rb" => { "DESKTOP_URL" => "url", "DESKTOP_SHA" => "sha256" } }.each do |path, fields|
              body = File.read(path)
              fields.each do |variable, field|
                pattern = /^  #{field} \".*\"$/
                replacement = "  #{field} \"#{ENV.fetch(variable)}\""
                abort "cask field missing: #{pattern}" unless body.sub!(pattern, replacement)
              end
              version = ENV.fetch("VERSION")
              body.sub!(/^  version \".*\"$/, "  version \"#{version}\"") or abort "cask version missing: #{path}"
              if path == "Casks/veasel-desktop.rb"
                signed = ENV.fetch("DESKTOP_SIGNED") == "true"
                status = if signed
                  "The release manifest marks this installer signed."
                else
                  "The release manifest marks this installer unsigned."
                end
                status_line = /^    The release manifest marks this installer (?:un)?signed\.$/
                abort "cask signature status missing: #{path}" unless body.sub!(status_line, "    #{status}")
              end
              File.write(path, body)
            end
          '
          brew tap veasel-labs/tap "$GITHUB_WORKSPACE"
          cp Casks/veasel-code.rb Casks/veasel-desktop.rb "$(brew --repo veasel-labs/tap)/Casks/"
          brew style --cask veasel-labs/tap/veasel-code
          brew style --cask veasel-labs/tap/veasel-desktop
      - name: Install and smoke-test the cask
        if: steps.release.outputs.skip_update != 'true' || steps.release.outputs.already_current == 'true'
        run: |
          set -euo pipefail
          brew install --cask veasel-labs/tap/veasel-code
          veasel --version
          veasel --help | grep -F "Commands:"
          executable="$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("veasel")))')"
          test -x "$(dirname "$executable")/veasel-tui"
          test -f "$(dirname "$executable")/build.json"
          brew install --cask veasel-labs/tap/veasel-desktop
          test -x /Applications/Veasel.app/Contents/MacOS/Veasel
      - name: Commit release update
        id: pull-request
        if: steps.release.outputs.skip_update != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          if git diff --quiet -- Casks/veasel-code.rb Casks/veasel-desktop.rb; then
            echo "Casks already reflect ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/veasel-code.rb Casks/veasel-desktop.rb
          git commit -m "chore: update Veasel Code to ${TAG}"
          git push --set-upstream origin "$BRANCH"
          cat > "$RUNNER_TEMP/cask-update-pr.md" <<EOF
          ## Summary

          Update the Homebrew cask to verified Veasel release ${TAG}.

          ## Validation

          The updater verifies GitHub's release-asset digests and the tag source SHA, then dispatches Homebrew CI on the exact PR head with previous-release install, upgrade, runtime checks, and uninstall. A human reviews and merges this change.

          ## Scope

          CLI/TUI and Desktop cask versions, release URLs, and SHA-256 values.
          The Desktop cask keeps the release manifest's signature status explicit.
          EOF
          pull_request="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" --repo "$GITHUB_REPOSITORY" \
              --title "chore: update Veasel Code to ${TAG}" \
              --body-file "$RUNNER_TEMP/cask-update-pr.md"
          else
            pull_request_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --draft --title "chore: update Veasel Code to ${TAG}" \
              --body-file "$RUNNER_TEMP/cask-update-pr.md")"
            pull_request="${pull_request_url##*/}"
          fi
          echo "number=$pull_request" >> "$GITHUB_OUTPUT"

      - name: Refresh existing release PR branch
        if: steps.release.outputs.existing_pr != '' && steps.release.outputs.already_current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release.outputs.existing_pr }}
        run: gh pr update-branch "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --rebase

      - name: Validate exact cask PR head on macOS
        if: steps.release.outputs.already_current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch_sha="$(git ls-remote origin "refs/heads/$BRANCH" | awk 'NR == 1 { print $1 }')"
          [[ "$branch_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve the exact update branch SHA for $BRANCH."
            exit 1
          }
          previous_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch "$BRANCH" --event workflow_dispatch --limit 20 \
            --json databaseId,headSha \
            | jq -r --arg expected_sha "$branch_sha" \
              '[.[] | select(.headSha == $expected_sha) | .databaseId] | max // 0')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            --field base_sha="$BASE_SHA"
          run_id=""
          delay=15
          for _ in $(seq 1 12); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$BRANCH" --event workflow_dispatch --limit 20 \
              --json databaseId,event,headSha \
              | jq -r --arg expected_sha "$branch_sha" \
                  --argjson previous_run_id "$previous_run_id" \
                  '[.[] | select(.headSha == $expected_sha and .databaseId > $previous_run_id)] | first | .databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep "$delay"
            if (( delay < 60 )); then
              delay=$((delay * 2 > 60 ? 60 : delay * 2))
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Homebrew CI did not start for exact PR head $branch_sha."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Close superseded automated release PRs
        if: steps.release.outputs.already_current == 'true' || steps.release.outputs.existing_pr != '' || steps.pull-request.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          NEW_PR: ${{ steps.pull-request.outputs.number || steps.release.outputs.existing_pr }}
          ALREADY_CURRENT: ${{ steps.release.outputs.already_current }}
        run: |
          set -euo pipefail
          open_updates="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq \
            --arg repo "$GITHUB_REPOSITORY" \
            '[.[] | select(
              .base.ref == "main" and
              .head.repo.full_name == $repo and
              .user.login == "github-actions[bot]" and
              (.head.ref | startswith("automation/cask-update-")) and
              (.title | startswith("chore: update Veasel Code to v"))
            ) | {number}]')"
          if [[ "$ALREADY_CURRENT" == "true" ]]; then
            superseding="main now matches ${TAG} (SHA-256 ${SHA}); validation run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            superseding="superseded by https://github.com/${GITHUB_REPOSITORY}/pull/${NEW_PR}, which updates to verified release ${TAG}"
          fi
          while IFS= read -r pull_request; do
            [[ -n "$pull_request" ]] || continue
            number="$(jq -r '.number' <<< "$pull_request")"
            [[ "$number" != "$NEW_PR" ]] || continue
            changed_files="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json files --jq '[.files[].path] | unique | join(",")')"
            if [[ "$changed_files" != "Casks/veasel-code.rb" && \
                  "$changed_files" != "Casks/veasel-code.rb,Casks/veasel-desktop.rb" ]]; then
              echo "::error::Cannot close superseded PR #${number}; it changes unexpected files: ${changed_files}"
              exit 1
            fi
            comment="Superseded: ${superseding}. This generated branch only changed the Veasel CLI/TUI and Desktop cask metadata. Closing its stale release proposal; the published release and existing artifacts are unchanged."
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "$comment"
          done < <(jq -c '.[]' <<< "$open_updates")
