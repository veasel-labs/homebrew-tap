name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    name: cask
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checked-out tap locally
        run: |
          brew tap veasel-labs/tap "$GITHUB_WORKSPACE"
          cp Casks/veasel-code.rb "$(brew --repo veasel-labs/tap)/Casks/veasel-code.rb"
      - run: brew style --cask veasel-labs/tap/veasel-code
      - run: brew install --cask veasel-labs/tap/veasel-code
      - name: Smoke-test the installed command and bundled TUI
        run: |
          set -euo pipefail
          veasel --version
          veasel --help | grep -F "Commands:"
          executable="$(python3 -c 'import os, shutil; print(os.path.realpath(shutil.which("veasel")))')"
          test -x "$(dirname "$executable")/veasel-tui"
          test -f "$(dirname "$executable")/build.json"
