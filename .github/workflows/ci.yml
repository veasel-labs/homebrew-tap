name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checked-out tap locally
        run: |
          brew tap veasel-labs/tap "$GITHUB_WORKSPACE"
          cp Formula/veasel-code.rb "$(brew --repo veasel-labs/tap)/Formula/veasel-code.rb"
      - run: brew style veasel-labs/tap/veasel-code
      - run: brew install veasel-labs/tap/veasel-code
      - run: brew test veasel-labs/tap/veasel-code
