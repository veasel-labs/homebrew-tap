name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    name: cask
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test previous cask version lookup
        run: python3 scripts/test_previous_cask.py
      - name: Install the previous cask version
        run: |
          brew tap veasel-labs/tap "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            previous_ref=FETCH_HEAD
          else
            previous_ref="${GITHUB_SHA}^"
          fi
          previous_cask="$RUNNER_TEMP/veasel-previous-cask.rb"
          python3 scripts/find_previous_cask.py "$GITHUB_WORKSPACE" "$previous_ref" \
            Casks/veasel-code.rb "$previous_cask"
          tap_cask="$(brew --repo veasel-labs/tap)/Casks/veasel-code.rb"
          cp "$previous_cask" "$tap_cask"
      - name: Install, upgrade, and uninstall the cask
        run: |
          set -euo pipefail
          cask_path="$(brew --repo veasel-labs/tap)/Casks/veasel-code.rb"
          cask_version() {
            ruby -ne 'puts $1 if $_ =~ /^\s*version "([^"]+)"/' "$1"
          }
          check_installed_release() {
            local cask_file="$1"
            local expected_version
            local expected_cli_version
            local actual_version
            local executable
            local tui_executable
            local actual_tui_version
            expected_version="$(cask_version "$cask_file")"
            expected_cli_version="${expected_version/.next./-next.}"
            actual_version="$(veasel --version)"
            test "$actual_version" = "Veasel Code ${expected_cli_version}"
            veasel --help | grep -F "Commands:"
            executable="$(resolve_path "$(command -v veasel)")"
            tui_executable="$(dirname "$executable")/veasel-tui"
            test -x "$tui_executable"
            actual_tui_version="$("$tui_executable" --version)"
            test "$actual_tui_version" = "Veasel Code Terminal ${expected_cli_version}"
            test -f "$(dirname "$executable")/build.json"
          }
          resolve_path() {
            python3 -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$1"
          }

          cp "$RUNNER_TEMP/veasel-previous-cask.rb" "$cask_path"
          brew install --cask veasel-labs/tap/veasel-code
          check_installed_release "$cask_path"

          cp Casks/veasel-code.rb "$cask_path"
          brew style --cask veasel-labs/tap/veasel-code
          brew upgrade --cask veasel-labs/tap/veasel-code
          check_installed_release Casks/veasel-code.rb

          brew uninstall --cask veasel-labs/tap/veasel-code
          command_path="$(brew --prefix)/bin/veasel"
          if [[ -e "$command_path" || -L "$command_path" ]]; then
            echo "::error::veasel remained on PATH after cask uninstall."
            exit 1
          fi
          if brew list --cask --versions veasel-code | grep -q .; then
            echo "::error::Cask remains installed after uninstall."
            exit 1
          fi
